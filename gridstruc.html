<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
    .container{
        display:grid;
        height:100vh;
        width: 60px;;
        grid-template-columns: 100px 100px 100px 100px ;
        grid-template-rows: 100px 100px 100px 100px ;
        grid-gap: 10px;
        color: rgb(7, 5, 5);
    }
  .box{
        height:100%;
        width:100%;
        background-color: rgb(2, 42, 95);
        grid-column: 1/1;
        grid-row: 1/5;

        justify-self: start;
        align-self: start;
  }
  .box2{
       height:100%;
        width:100%;
        background-color: rgb(129, 23, 115);
        grid-column: 2/5;
        grid-row: 1/1;
        justify-self:end;
        align-self: start;
  }
    .box3{
        height:100%;
        width:100%;
        background-color: rgb(19, 109, 139);
        
        grid-row: 2/2;
        justify-self:start;
        align-self: center;
    }
    .box4{
        height:100%;
        width:100%;
        background-color: rgb(28, 185, 122);
        grid-row: 2/3;
        justify-self: center;
        align-self: center;
    }
    .box5{
        height:100%;
        width:100%;
        background-color: rgb(203, 210, 17);
        
        justify-self: end;
        align-self: end;
    }
    .box6{
        height:100%;
        width:100%;
        background-color: rgb(37, 37, 24);
        grid-row: 3/5;
        grid-column: 2/4;
        justify-self: end;
        align-self: end;
    }
    .box7{
        height:100%;
        width:100%;
        background-color: rgb(16, 47, 35);
        grid-row: 5/3;
        grid-column: 5/4;
        justify-self: end;
        align-self: end;
    }
  
    
</style>

<body>
    <div>
        <div class="container">
            <div class="box"></div>
            <div class="box2"></div>
            <div class="box3"></div>
                <div class="box4"></div>
                <div class="box5"></div>
                <div class="box6"></div>
              <div class="box7"></div>
              
        </div>
        </div>
    </div>
</body>
</html>
